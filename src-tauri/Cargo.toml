[package]
name = "video-edit"
version = "0.1.0"
description = "Desktop video trimmer — define trim segments on a timeline and export via FFmpeg"
authors = ["jassde"]
edition = "2021"

[lib]
name = "video_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
